<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="description" content="3d example using three.js.">
    <meta name="author" content="awne">
    <meta name="title" content="3d example using three.js"/>
    <link rel="canonical" href="https://awne.xyz/box"/>
    <meta name="og:title" content="3d example using three.js"/>
    <meta name="og:description" content="awne's website for awne's things."/>
    <meta name="og:type" content="website"/>
    <meta name="og:url" content="https://awne.xyz/box"/>
    <meta name="og:image" content="https://cdn.awne.xyz/images/colorful-cube-with-lines-dots_81048-31200.jpgs"/>
    <link rel="shortcut icon" type="image/jpg" href="https://cdn.awne.xyz/images/colorful-cube-with-lines-dots_81048-31200.jpgs"/>
    <link rel="icon" type="image/jpg" href="https://cdn.awne.xyz/images/colorful-cube-with-lines-dots_81048-31200.jpgs"/>
	<link rel="stylesheet" href="../pixel.css">
	<script type="text/javascript" src="main.js"></script>
	<style type="text/css">
		
		body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #000;
            --px-scan: #0f0;
            --px-scan-opacity: 0.12;
        }

        .cube-container {
            perspective: 800px;
        }

        .cube {
            width: 200px;
            height: 200px;
            transform-style: preserve-3d;
            transform: rotateX(45deg) rotateY(45deg);
            /* frame-based spin: 60 frames per 5s turn */
            animation: rotateCube 5s infinite steps(60, jump-end);
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            /* square 4px dots along each edge, over a glow in hard bands */
            background:
                linear-gradient(to right, #0f0 50%, transparent 0) top left / 8px 4px repeat-x,
                linear-gradient(to right, #0f0 50%, transparent 0) bottom left / 8px 4px repeat-x,
                linear-gradient(to bottom, #0f0 50%, transparent 0) top left / 4px 8px repeat-y,
                linear-gradient(to bottom, #0f0 50%, transparent 0) top right / 4px 8px repeat-y,
                radial-gradient(rgba(0, 255, 0, 0.8) 0 30%, rgba(0, 255, 0, 0.6) 30% 40%, rgba(0, 255, 0, 0.4) 40% 50%, rgba(0, 255, 0, 0.2) 50% 60%, rgba(0, 255, 0, 0.1) 60% 70%, transparent 70%);
        }

        .front  { transform: translateZ(100px); }
        .back   { transform: rotateY(180deg) translateZ(100px); }
        .right  { transform: rotateY(90deg) translateZ(100px); }
        .left   { transform: rotateY(-90deg) translateZ(100px); }
        .top    { transform: rotateX(90deg) translateZ(100px); }
        .bottom { transform: rotateX(-90deg) translateZ(100px); }

        @keyframes rotateCube {
            from { transform: rotateX(0) rotateY(0); }
            to { transform: rotateX(360deg) rotateY(360deg); }
        }

	</style>
</head>
<body class="px-scanlines">
    <div class="cube-container">
        <div class="cube">
            <div class="face front"></div>
            <div class="face back"></div>
            <div class="face right"></div>
            <div class="face left"></div>
            <div class="face top"></div>
            <div class="face bottom"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
